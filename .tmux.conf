set -g base-index 1
setw -g pane-base-index 1

set-option -as command-alias 'S=display-message -p "#{session_name}"'
set-option -as command-alias 'CDC=attach-session -c "#{pane_current_path}"'

bind r source-file ~/.tmux.conf \; display-message "config reloaded ✔"

setw -g window-status-style "fg=black"
setw -g window-status-current-style "bold"

set -g status-style "bg=color150,fg=black"
set -g status-left " "

set -g status-interval 30

set -g status-right '%H:%M #(bash $HOME/.dotfiles-modules/terminal/tmux-battery.sh)'

set-window-option -g mode-keys vi
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
